[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartprompt"
version = "3.0.0"
description = "Lint before you send. Bad prompt in, bad work out — and it's your name on it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartprompt", "devtools"]
dependencies = []

[project.urls]
Homepage = "https://smarttasks.cloud"
Standard = "https://iaiso.org"
Repository = "https://github.com/SmartTasksOrg/sf-smartprompt"

[project.scripts]
sf-smartprompt = "sf_smartprompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
