[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartprompt"
version = "3.0.0"
description = "Lint before you send. Bad prompt in, bad work out — and it's your name on it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartprompt", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartprompt"
Issues = "https://github.com/SmartTasksOrg/sf-smartprompt/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartprompt/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartprompt/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartprompt = "sf_smartprompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
